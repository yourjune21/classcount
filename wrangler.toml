# Cloudflare Pages 설정 — Wrangler(명령줄)로 배포할 때만 씁니다.
# GitHub 연동(대시보드)으로 배포한다면 이 파일은 무시되며, KV·변수는 대시보드에서 설정합니다.
name = "classcount"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./public"

[[kv_namespaces]]
binding = "SCHOOLS"
id = "여기에_KV_네임스페이스_ID"   # wrangler kv namespace create SCHOOLS 결과의 id
